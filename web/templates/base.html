<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CS2 Predictor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <span class="logo-icon">&#9876;</span>
                CS2 Predictor
            </a>
            <ul class="nav-links">
                <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a></li>
                <li><a href="/predictions" class="{% if request.path == '/predictions' %}active{% endif %}">Predictions</a></li>
                <li><a href="/teams" class="{% if request.path == '/teams' %}active{% endif %}">Teams</a></li>
                <li><a href="/stats" class="{% if request.path == '/stats' %}active{% endif %}">Statistics</a></li>
            </ul>
            <div class="nav-actions">
                <button id="btn-refresh" class="btn btn-sm btn-outline" title="Refresh data">&#8635; Update</button>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>CS2 Match Predictor &mdash; Data from HLTV.org &mdash; Predictions based on Elo/Glicko2 + XGBoost ML</p>
    </footer>

    <div id="toast-container"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
